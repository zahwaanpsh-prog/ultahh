<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Disya 💖</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff9ecf, #ffc1e3, #ffb6d9);
    text-align: center;
    color: #a1005a;
}

/* Container */
.container {
    position: relative;
    z-index: 2;
    padding-top: 70px;
}

/* Judul */
h1 {
    font-size: 3em;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px #ff66b2; }
    to { text-shadow: 0 0 25px #ff1493; }
}

/* Pesan */
.typing {
    width: 85%;
    margin: 20px auto;
    font-size: 1.2em;
    min-height: 150px;
}

/* Tombol */
button {
    padding: 12px 25px;
    font-size: 1em;
    border: none;
    border-radius: 30px;
    background: #ff4da6;
    color: white;
    cursor: pointer;
    margin: 10px;
    transition: 0.3s;
}

button:hover {
    background: #a1005a;
    transform: scale(1.1);
}

/* Hati */
.heart {
    position: absolute;
    font-size: 20px;
    animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-100vh); opacity: 0; }
}

/* Balon */
.balloon {
    position: absolute;
    bottom: -120px;
    width: 40px;
    height: 60px;
    border-radius: 50%;
    animation: rise 8s linear infinite;
}

@keyframes rise {
    to { transform: translateY(-120vh); }
}

/* Sparkle */
.sparkle {
    position: absolute;
    width: 5px;
    height: 5px;
    background: white;
    border-radius: 50%;
    animation: twinkle 1.5s infinite alternate;
}

@keyframes twinkle {
    from { opacity: 0.3; }
    to { opacity: 1; }
}

/* Confetti */
.confetti {
    position: absolute;
    width: 8px;
    height: 8px;
    animation: fall 3s linear forwards;
}

@keyframes fall {
    to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

</style>
</head>
<body>

<div class="container">
    <h1>🎉 Selamat Ulang Tahun Disya 💗</h1>
    <div class="typing" id="message"></div>

    <button onclick="playMusic()">🎵 Putar Musik</button>
    <button onclick="celebrate()">🎁 Kejutan Spesial</button>
</div>

<!-- Musik -->
<audio id="bgMusic" loop>
    <source src="musik.mp3" type="audio/mpeg">
</audio>

<script>

/* ===== Efek Ketik ===== */
const text = `
Disya yang istimewa ✨

Di hari ulang tahunmu ini,
semoga setiap langkahmu dipenuhi kebahagiaan,
setiap mimpimu menemukan jalannya,
dan setiap harimu dihiasi senyuman indah.

💗 Doa untukmu:
Semoga panjang umur, sehat selalu,
diberikan rezeki yang berkah,
dimudahkan segala urusan,
dan selalu berada dalam lindungan Tuhan.

✨ Kata Mutiara:
"Teruslah menjadi pribadi yang lembut namun kuat,
karena dunia membutuhkan keindahan hatimu."
`;

let i = 0;
function typeWriter() {
    if (i < text.length) {
        document.getElementById("message").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 35);
    }
}
typeWriter();

/* ===== Musik ===== */
function playMusic() {
    document.getElementById("bgMusic").play();
}

/* ===== Hati Melayang ===== */
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * window.innerWidth + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}
setInterval(createHeart, 500);

/* ===== Balon ===== */
function createBalloon() {
    const balloon = document.createElement("div");
    balloon.classList.add("balloon");
    balloon.style.left = Math.random() * window.innerWidth + "px";
    balloon.style.background = `hsl(${Math.random()*40+300}, 80%, 70%)`;
    balloon.style.animationDuration = (6 + Math.random()*4) + "s";
    document.body.appendChild(balloon);
    setTimeout(() => balloon.remove(), 8000);
}
setInterval(createBalloon, 2000);

/* ===== Sparkle ===== */
for(let i=0;i<40;i++){
    const sparkle = document.createElement("div");
    sparkle.classList.add("sparkle");
    sparkle.style.top = Math.random()*window.innerHeight+"px";
    sparkle.style.left = Math.random()*window.innerWidth+"px";
    document.body.appendChild(sparkle);
}

/* ===== Confetti ===== */
function celebrate() {
    for(let i=0;i<120;i++){
        const conf = document.createElement("div");
        conf.classList.add("confetti");
        conf.style.left = Math.random()*window.innerWidth+"px";
        conf.style.background = `hsl(${Math.random()*360}, 80%, 70%)`;
        document.body.appendChild(conf);
        setTimeout(()=>conf.remove(),3000);
    }
    alert("💖 Happy Birthday Disya! Semoga selalu bahagia 🎂✨");
}

</script>

</body>
</html>
